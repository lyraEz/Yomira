name: CI

# Checks every push and pull request (formatting, detekt, unit tests). Building the unsigned
# APKs is left to manual runs: the signed ones come from release.yml, and keeping ~160 MB of
# APKs per push as artifacts filled the 500 MB of Actions storage included in the free plan.
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting (files changed since the upstream base)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew --no-daemon detekt

      - name: Unit tests
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          :domain:testDebugUnitTest --tests 'mihon.domain.extensionrepo.*'

      # Two inherited domain tests (LibraryFlagsTest, FetchIntervalTest) already fail on the
      # AniZen base commit; the full suite is reported here without blocking the build.
      - name: Inherited domain tests (informational)
        continue-on-error: true
        run: ./gradlew --no-daemon :domain:testDebugUnitTest

      - name: Build unsigned release APKs
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Inspect APKs
        if: github.event_name == 'workflow_dispatch'
        run: scripts/yomira/inspect-apks.sh app/build/outputs/apk/release

      - name: Upload APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: yomira-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/apk-report.txt
          retention-days: 1
