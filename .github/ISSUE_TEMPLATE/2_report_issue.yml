name: Bug report
description: Report a problem in Yomira
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Opened ...
        2. Tapped OK on ...
        3. Then ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What should happen
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Report or logs
      description: |
        For extensions, use "Report > Copy report" in the extension list. For crashes,
        More > Settings > Advanced > Share crash logs. With ADB: `adb logcat -d > log.txt`.

  - type: input
    id: app-version
    attributes:
      label: Yomira version
      description: More > About.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone, Android version and architecture
      description: "Phone model, Android version and architecture (Settings > About phone)."
      placeholder: "Galaxy A54, Android 14, arm64-v8a"
    validations:
      required: true

  - type: input
    id: extension
    attributes:
      label: Extension and repository (if relevant)
      placeholder: "Extension name and version, repository"
