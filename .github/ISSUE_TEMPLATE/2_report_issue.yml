name: Problema
description: Relate um problema no Yomira
labels: [problema]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri ...
        2. Apertei OK em ...
        3. Aconteceu ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: O que deveria acontecer
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: O que aconteceu
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico ou registros
      description: |
        Para extensões, use "Diagnóstico → Copiar diagnóstico" na lista de extensões. Para travamentos,
        Mais → Configurações → Avançado → Compartilhar os registros de travamentos. Com ADB: `adb logcat -d > log.txt`.

  - type: input
    id: app-version
    attributes:
      label: Versão do Yomira
      description: Mais → Sobre.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Aparelho, sistema e arquitetura
      description: "Resultado de `adb shell getprop ro.product.model`, `ro.build.version.sdk` e `ro.product.cpu.abilist`, ou o modelo e a versão do Fire OS."
      placeholder: "Fire TV Stick (3ª geração), Fire OS 7, API 28, armeabi-v7a"
    validations:
      required: true

  - type: input
    id: extension
    attributes:
      label: Extensão e repositório (se for o caso)
      placeholder: "RedeToons 1000-9, repositório Rede"
