name: Release

# Publishes signed APKs as a GitHub release, which the in-app updater reads.
#
# Runs on every push to the development branch and on demand. A cheap first job reads
# versionName from app/build.gradle.kts and stops when release v<versionName> already exists,
# so only a version bump produces a new release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   YOMIRA_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   YOMIRA_KEYSTORE_PASSWORD  keystore password
#   YOMIRA_KEY_ALIAS          key alias
#   YOMIRA_KEY_PASSWORD       key password (may be the same as the keystore password)
on:
  push:
    branches:
      - ccr-c637b615-t3byst
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Read version and look for its release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version not found; it will be built and published."
          fi

  release:
    name: Build signed release
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YOMIRA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::YOMIRA_KEYSTORE_BASE64 is not set; refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yomira-release.jks"
          echo "YOMIRA_KEYSTORE_FILE=$RUNNER_TEMP/yomira-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          YOMIRA_KEYSTORE_PASSWORD: ${{ secrets.YOMIRA_KEYSTORE_PASSWORD }}
          YOMIRA_KEY_ALIAS: ${{ secrets.YOMIRA_KEY_ALIAS }}
          YOMIRA_KEY_PASSWORD: ${{ secrets.YOMIRA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -Penable-updater=true

      - name: Inspect APKs (launcher, SDK levels, ABIs)
        run: scripts/yomira/inspect-apks.sh app/build/outputs/apk/release

      - name: Collect, verify and checksum
        id: collect
        run: scripts/yomira/package-release.sh app/build/outputs/apk/release dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yomira-release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Yomira ${{ steps.collect.outputs.version }}
          draft: false
          make_latest: ${{ inputs.prerelease != true }}
          prerelease: ${{ inputs.prerelease == true }}
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
